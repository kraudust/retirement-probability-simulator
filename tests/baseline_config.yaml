# ============================================================================
# ALL DOLLAR FIGURES ARE IN TODAY'S DOLLARS (real, inflation-adjusted).
# Enter NOMINAL market returns; inflation is divided out internally.
# Any growth rate below is therefore growth ABOVE inflation.
# ============================================================================

accounts:
  roth: 135700
  traditional: 270000
  brokerage: 5500
  cash: 86000
  # What you actually PAID for the brokerage holdings. Only the gain above this is
  # taxable when you sell. If you don't know it, a reasonable guess is 60-80% of the
  # balance for a recently funded account. The simulator tracks it from here on:
  # sales remove basis pro-rata, reinvested dividends and new contributions add it.
  brokerage_cost_basis: 4500

contributions:
  annual_roth: 15000          # Roth IRA / Roth 401k
  annual_traditional: 33750   # Traditional 401k / IRA, including employer match
  annual_brokerage: 10000     # Taxable brokerage
  annual_cash: 0              # Additional cash savings
  # REAL growth, i.e. growth ABOVE inflation, because this model is in today's
  # dollars. 0.0 = your contributions keep pace with inflation (a cost-of-living
  # raise), which is the neutral assumption. 0.03 would mean a 3% raise EVERY YEAR
  # ON TOP of inflation -- 1.8x your real contribution after 20 years. Typical
  # long-run real wage growth is under 1%, so keep this at or near 0.
  annual_contribution_growth_rate: 0.0

life_events:
  # How each simulated lifespan is drawn.
  #   ssa_inspired -- Gompertz mortality calibrated to SSA cohort life tables.
  #                   Realistic longevity risk: some lives end in the 60s, a few
  #                   reach 100+. death_age_mean/std/min are IGNORED; death_age_max
  #                   caps the tail (and sizes the trajectory chart).
  #   normal       -- normal(mean, std) clipped to [min, max]. Fully user-controlled,
  #                   e.g. for "what if I plan to exactly age 95" experiments.
  mortality_model: ssa_inspired
  mortality_sex: male
  death_age_mean: 93          # normal model only. Higher = more conservative.
  death_age_std: 8            # normal model only
  death_age_min: 70           # normal model only
  death_age_max: 110          # hard cap for BOTH models; also sizes the fan chart

  ss_claim_age: 67            # 62 = earliest, 67 = full, 70 = maximum
  # Your benefit at full retirement age assuming a FULL 35-year career.
  # Check your real number at ssa.gov/myaccount. The simulator rebuilds the benefit
  # through the progressive PIA bend-point formula for shorter careers, so retiring
  # early costs less than a straight years/35 proration -- as under the real rules.
  ss_annual_full_retirement_benefit: 40000
  # Years of Social Security-covered earnings you already have. SS averages your
  # best 35 years and missing years count as zero in that average.
  ss_earnings_years_at_current_age: 13
  # SSA work credits you already have (4 per year worked, shown on your SSA
  # statement). 40 credits -- roughly ten working years -- are required for ANY
  # retirement benefit; retire before earning them and the model pays nothing.
  ss_credits_at_current_age: 40
  ss_benefit_years_required: 35
  ss_retirement_eligibility_credits: 40

spouse:
  # Set enabled: true to model a couple. Household spending drops to
  # survivor_spending_factor after the first death, the survivor inherits the
  # LARGER of the two Social Security benefits, and the survivor files taxes as
  # SINGLE thereafter -- half the deduction, compressed brackets (the widow's tax
  # penalty). When false, every field below is ignored.
  enabled: false
  age_offset: -2              # spouse_age = your_age + this (-2 = two years younger)
  mortality_model: ssa_inspired
  mortality_sex: female
  death_age_mean: 95          # normal model only
  death_age_std: 8            # normal model only
  death_age_min: 70           # normal model only
  death_age_max: 110          # hard cap for both models
  ss_claim_age: 67
  # A spouse with little or no earnings record still collects the SPOUSAL benefit,
  # worth up to 50% of your PIA. That is applied automatically -- for a stay-at-home
  # partner set benefit, years, and credits to 0 and the model pays the spousal
  # benefit instead of their (nonexistent) own benefit.
  ss_annual_full_retirement_benefit: 0
  ss_earnings_years_at_current_age: 0
  ss_credits_at_current_age: 0
  survivor_spending_factor: 0.75   # housing/utilities barely change, so well above 0.5

market:
  # Enter NOMINAL returns. Converted to real internally.
  stock_return: 0.08          # US history ~10% nominal; forward estimates 5-7%
  bond_return: 0.045
  # This is the CALM-market volatility. Crises double it and occupy ~21% of all
  # months, so the effective all-in volatility is about 1.28x this number: 0.15 here
  # produces ~19% overall, matching the S&P's historical ~18-20%.
  stock_volatility: 0.15
  bond_volatility: 0.05
  inflation: 0.03             # mean; long-run US CPI ~3%, Fed target 2%
  # Inflation is not certain. This is its annual standard deviation, and it matters
  # because bonds and cash pay a fixed nominal amount -- an inflation surprise comes
  # straight off their real return. ~1.5% is consistent with post-war US experience.
  inflation_volatility: 0.015
  cash_return: 0.04
  # Annual TAX DRAG on the taxable brokerage account. Total return is unchanged
  # (dividends/interest are already inside the returns above); these set how much of
  # it is DISTRIBUTED and therefore taxed every year even when nothing is sold.
  # Dividends are taxed at qualified-dividend (LTCG) rates, bond and cash interest
  # at ordinary rates; reinvested distributions raise the cost basis. ~1.5% matches
  # a broad US index fund; bond interest should roughly equal the bond return.
  stock_dividend_yield: 0.015
  bond_taxable_yield: 0.045
  # Correlation between stock and bond shocks. -0.3 means bonds rise modestly when
  # stocks fall. NOTE: US stock/bond correlation was negative 2000-2021 but strongly
  # POSITIVE in 2022 when both fell together, and is near zero over the long run.
  # Values below -0.2 assume a dependable hedge and are on the optimistic side.
  stock_bond_correlation: -0.1

taxes:
  # 2026 federal numbers (IRS Rev. Proc. 2025-32), held constant in REAL terms --
  # correct for the bracket thresholds and deductions, which the IRS indexes to
  # inflation every year. Every table below is keyed by filing status because the
  # status can CHANGE inside a simulation: when the first spouse dies, the survivor
  # files as single from the next tax year.
  #
  # NOTE: your filing status is independent of the `spouse.enabled` switch above.
  # Turning spouse modelling off does NOT make you a single filer -- that switch only
  # controls whether a second lifespan and benefit are simulated.
  filing_status: married_filing_jointly

  standard_deductions:
    single: 16100
    married_filing_jointly: 32200
    qualifying_surviving_spouse: 32200
    head_of_household: 24150

  # IRC 63(f), PER qualifying filer aged 65+ (2026). MFJ can claim it twice.
  additional_standard_deductions_65plus:
    single: 2050
    married_filing_jointly: 1650
    qualifying_surviving_spouse: 1650
    head_of_household: 2050

  # [upper_bound, rate] pairs in TAXABLE income (after the standard deduction),
  # lowest first, null upper bound on the top bracket.
  federal_brackets:
    single:
      - [12400, 0.10]
      - [50400, 0.12]
      - [105700, 0.22]
      - [201775, 0.24]
      - [256225, 0.32]
      - [640600, 0.35]
      - [null, 0.37]
    married_filing_jointly:
      - [24800, 0.10]
      - [100800, 0.12]
      - [211400, 0.22]
      - [403550, 0.24]
      - [512450, 0.32]
      - [768700, 0.35]
      - [null, 0.37]
    qualifying_surviving_spouse:
      - [24800, 0.10]
      - [100800, 0.12]
      - [211400, 0.22]
      - [403550, 0.24]
      - [512450, 0.32]
      - [768700, 0.35]
      - [null, 0.37]
    head_of_household:
      - [17700, 0.10]
      - [67450, 0.12]
      - [105700, 0.22]
      - [201750, 0.24]
      - [256200, 0.32]
      - [640600, 0.35]
      - [null, 0.37]

  # Long-term capital gains (2026). Note the 0% band: a married retiree can realise
  # nearly $99k of gains at a 0% federal rate if ordinary income is modest -- and a
  # SINGLE filer only about half that, which is why the survivor's taxes jump.
  ltcg_brackets:
    single:
      - [49450, 0.00]
      - [545500, 0.15]
      - [null, 0.20]
    married_filing_jointly:
      - [98900, 0.00]
      - [613700, 0.15]
      - [null, 0.20]
    qualifying_surviving_spouse:
      - [98900, 0.00]
      - [613700, 0.15]
      - [null, 0.20]
    head_of_household:
      - [66200, 0.00]
      - [579600, 0.15]
      - [null, 0.20]

  state_tax_rate: 0.05        # flat approximation; 0.0 for TX/FL/WA/NV/TN

  # The IRS charges an extra 10% on traditional 401k/IRA withdrawals before 59.5.
  # This is a major cost for retiring in your 40s or 50s.
  early_withdrawal_penalty: 0.10
  penalty_free_age: 59.5
  # Set true if you will use a Rule 72(t) substantially-equal-payments schedule or a
  # Roth conversion ladder, both of which legally avoid the penalty (withdrawals are
  # still taxed as ordinary income). Doing so takes real planning, so leaving this
  # false is the conservative choice.
  use_72t_sepp: false
  # Rule of 55: employer-plan (401k/403b) money can be withdrawn penalty-free after
  # separating from service in or after the year you turn 55. Only enable if your
  # traditional bucket is genuinely employer-plan money you would leave in the plan;
  # IRAs never qualify.
  assume_qualified_plan_age55_exception: false

  # Social Security taxation thresholds on "provisional income" (other income +
  # half your benefit), per IRC 86. Statutorily fixed in NOMINAL dollars since
  # 1983/1993; held real-constant here, which assumes eventual indexing -- see
  # README limitations.
  ss_provisional_thresholds:
    single: [25000, 34000]
    married_filing_jointly: [32000, 44000]
    qualifying_surviving_spouse: [32000, 44000]
    head_of_household: [25000, 34000]
  ss_max_taxable_fraction: 0.85

  # Net Investment Income Tax (IRC 1411): 3.8% of investment income to the extent
  # AGI exceeds the threshold. Rarely binds at modest retirement spending, but it
  # is real law and it is cheap to model exactly.
  niit_rate: 0.038
  niit_thresholds:
    single: 200000
    married_filing_jointly: 250000
    qualifying_surviving_spouse: 250000
    head_of_household: 200000

healthcare:
  # ADDED ON TOP of spending.initial_annual_expenses, per living person.
  # Set initial_annual_expenses to your spending EXCLUDING health premiums.
  # Before Medicare you buy ACA marketplace coverage, which is far pricier than an
  # employer plan. $12k/yr is typical for an unsubsidised single adult policy plus
  # out-of-pocket costs; subsidies can cut this sharply at low taxable income.
  pre_medicare_annual_premium: 12000
  medicare_annual_premium: 2500   # Part B + Part D + supplement, roughly
  medicare_age: 65

simulation:
  current_age: 35
  min_retirement_age: 40
  max_retirement_age: 70
  target_success_probability: 0.95
  monte_carlo_runs: 5000
  # Any value >= 0 makes runs exactly reproducible; -1 draws fresh entropy each run.
  # Keep a fixed seed when comparing financial decisions, so the difference you see
  # is the decision and not sampling noise.
  random_seed: 20260815
  # Test every retirement age against the SAME set of random lifetimes (same deaths,
  # same market paths). This makes the success-vs-age curve dramatically less noisy
  # exactly where you read it -- at the crossing of your target. Leave it on.
  common_random_numbers: true
  glide_path: true
  glide_path_start_stock_pct: 0.90
  glide_path_end_stock_pct: 0.50
  glide_path_years: 31        # years to move from start to end allocation
  # Fat-tail severity for stock returns. Lower = more extreme crashes possible.
  # 6 reproduces the historical frequency of large one-year losses.
  # 30+ is effectively a normal distribution (no fat tails).
  return_distribution_degrees_of_freedom: 6
  static_stock_allocation: 0.75   # used only when glide_path is false
  # Crises are a recurring state, so they permanently drag the average return below
  # stock_return. With this true, the calm-market return is raised just enough that
  # the LONG-RUN AVERAGE equals the stock_return you entered -- so 8% means 8%.
  # Set false if you intend stock_return to be the pre-crisis trend instead.
  compensate_crisis_drag: true
  # SECURE 2.0: Required Minimum Distributions start at 73 if you were born
  # 1951-1959, 75 if born 1960 or later. Someone 35 in 2026 uses 75.
  rmd_start_age: 75
  normal_regime:
    return_boost: 0.0         # ANNUAL rate, e.g. 0.01 = +1%/yr in calm markets
    volatility_multiplier: 1.0
    monthly_crisis_probability: 0.015   # ~1 crisis every 5.6 years
  crisis_regime:
    # Mild: -0.08, vol 1.5 — correction
    # Moderate: -0.12, vol 2.0 — typical bear market
    # Severe: -0.20, vol 2.5 — 2008-style crash
    annual_return_drag: -0.12
    volatility_multiplier: 2.0
    # Sets crisis LENGTH: average spell = 1/this months. 0.055 gives ~18 months,
    # matching the historical average bear market. Higher values produce short dips
    # and understate the multi-year downturns that actually break retirements.
    monthly_recovery_probability: 0.055

spending:
  # Your spending EXCLUDING health insurance premiums (those live under healthcare).
  initial_annual_expenses: 80000.00
  # The "retirement spending smile" (Blanchett): real spending drifts down through
  # your 70s, then the late-life upturn comes through healthcare costs.
  spending_decline_start_age: 70
  annual_spending_decline_rate: 0.99   # 0.99 = 1% less each year
  spending_decline_end_age: 80
  # After decline_end_age, the per-person HEALTH PREMIUMS grow at this rate (medical
  # inflation above CPI). Base spending stays at its declined level; long-term-care
  # shocks are NOT modelled.
  annual_healthcare_increase_rate: 0.015
  # Guardrails: adjust spending in response to the portfolio's own return over the
  # past year. This is how real retirees behave and is what makes higher withdrawal
  # rates survivable.
  guardrail_cut_return_threshold: -0.10   # cut if the past year returned worse than -10%
  guardrail_cut_amount: 0.90              # multiply spending by this when cutting
  guardrail_cut_floor: 0.70               # never cut below 70% of plan
  guardrail_raise_return_threshold: 0.15  # raise if the past year returned over +15%
  guardrail_raise_amount: 1.05
  guardrail_raise_ceiling: 1.30           # never raise above 130% of plan
